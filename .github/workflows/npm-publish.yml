name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Verify release version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Verify changelog entry exists
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if ! grep -Eq "^## \\[?$VERSION\\]?($|[[:space:]-])" CHANGELOG.md; then
            echo "CHANGELOG.md has no release entry for version $VERSION"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
